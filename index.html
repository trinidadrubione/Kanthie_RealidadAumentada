<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Kanthié · Prueba tus joyas con Realidad Aumentada</title>
    <meta
      name="description"
      content="Probate anillos de Kanthié con realidad aumentada: elegí modelo, material, forma y color de la piedra, y vé cómo te quedan en tu propia mano."
    />

    <!-- Vista previa 3D -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ></script>

    <!-- Three.js para el motor de AR (import map) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ============================ HEADER ============================ -->
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark">K</span>
        <span class="brand-name">KANTHIÉ</span>
      </div>
      <p class="tagline">Probate nuestras joyas en realidad aumentada</p>
    </header>

    <!-- ============================ WIDGET ============================ -->
    <main class="widget">
      <!-- Vista previa -->
      <section class="preview-pane">
        <model-viewer
          id="preview"
          alt="Vista previa 3D del anillo"
          camera-controls
          auto-rotate
          auto-rotate-delay="0"
          rotation-per-second="18deg"
          shadow-intensity="1"
          exposure="1.05"
          environment-image="neutral"
          camera-orbit="0deg 75deg 105%"
          interaction-prompt="none"
        >
          <div class="mv-progress" slot="progress-bar"></div>
        </model-viewer>
        <div id="variant-label" class="variant-label"></div>
      </section>

      <!-- Configurador -->
      <section class="config-pane">
        <div class="field">
          <h2 class="field-title">Modelo</h2>
          <div id="product-list" class="product-list"></div>
        </div>

        <div class="field">
          <h2 class="field-title">Material</h2>
          <div id="material-swatches" class="swatches"></div>
        </div>

        <div class="field">
          <h2 class="field-title">Piedra</h2>
          <div id="stone-swatches" class="swatches"></div>
        </div>

        <div class="field field-inline">
          <div>
            <h2 class="field-title">Dedo</h2>
            <div id="finger-buttons" class="chips"></div>
          </div>
          <div>
            <h2 class="field-title">Posición</h2>
            <div id="placement-buttons" class="chips"></div>
          </div>
        </div>

        <button id="try-btn" class="try-btn">
          <span class="try-icon" aria-hidden="true">✦</span>
          Probar en mi mano
        </button>
        <p class="try-note">
          Requiere permiso de cámara. En celulares funciona sobre HTTPS.
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> Kanthié · Realidad Aumentada</span>
    </footer>

    <!-- ========================= AR OVERLAY ========================= -->
    <div id="ar-overlay" class="ar-overlay" aria-hidden="true">
      <video id="ar-video" class="ar-video" playsinline muted autoplay></video>
      <canvas id="ar-canvas" class="ar-canvas"></canvas>

      <div class="ar-topbar">
        <button id="ar-close" class="ar-btn" aria-label="Cerrar">✕</button>
        <div class="ar-title">Prueba en la mano</div>
        <button id="ar-flip" class="ar-btn" aria-label="Cambiar cámara">⟲</button>
      </div>

      <div id="ar-status" class="ar-status hidden"></div>

      <div id="ar-hint" class="ar-hint hidden">
        Mostrá tu mano abierta frente a la cámara ✋
      </div>
    </div>

    <script type="module" src="./app.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
